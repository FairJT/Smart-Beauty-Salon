services:
  # ─── SQL Server (Azure SQL Edge) ─────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: SmartSalonSQL
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SmartSalon2024!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "SmartSalon2024!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - salon-network

  # ─── SmartSalon Monolith (Razor Pages + API) ────────────────
  smartsalon:
    build:
      context: ./SmartSalon
      dockerfile: Dockerfile
    container_name: SmartSalonApp
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5015"
      JWT_SECRET: "SmartSalon2024!DockerSecretKeyForJWT@#$%"
    ports:
      - "5015:5015"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - salon-network

  # ─── SalonOS API (Modular Monolith) ─────────────────────────
  salonos-api:
    build:
      context: .
      dockerfile: Dockerfile.SalonOS
    container_name: SalonOSApi
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5016"
      JWT_SECRET: "SalonOS2024!DockerSecretKeyForJWT@#$%"
    ports:
      - "5016:5016"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - salon-network

volumes:
  sqlserver_data:

networks:
  salon-network:
    driver: bridge
