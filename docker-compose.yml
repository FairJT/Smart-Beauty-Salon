services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: SmartSalonSQL
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SmartSalon2024!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "SmartSalon2024!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data:
