# ═══════════════════════════════════════════════════════════════
# SmartSalon - Docker Compose
# Services: SQL Server, Backend API, SalonOS API, Flutter Web
# ═══════════════════════════════════════════════════════════════

services:

  # ─── SQL Server (Azure SQL Edge) ─────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: SmartSalonSQL
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - salon-network

  # ─── SmartSalon Backend (ASP.NET API + Razor Pages) ──────────
  smartsalon:
    build:
      context: SmartSalon
      dockerfile: Dockerfile
    container_name: SmartSalonApp
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5015"
      JWT_SECRET: "${JWT_SECRET}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SmartSalonDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5015:5015"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5015/swagger/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - salon-network

  # ─── Flutter Web App (Nginx + reverse proxy) ─────────────────
  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile.FlutterWeb
      args:
        API_BASE_URL: /api
    container_name: FlutterWeb
    ports:
      - "5080:80"
    depends_on:
      salonos-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - salon-network

  # ─── SalonOS API (Modular Monolith) ─────────────────────────
  salonos-api:
    build:
      context: .
      dockerfile: Dockerfile.SalonOS
    container_name: SalonOSApi
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5016"
      JWT_SECRET: "${JWT_SECRET}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SalonOSDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5016:5016"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5016/swagger/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - salon-network

volumes:
  sqlserver_data:

networks:
  salon-network:
    driver: bridge
