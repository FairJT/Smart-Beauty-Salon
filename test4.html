<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="/">
<title>Test Flutter Manual Load</title>
</head>
<body>
<h1>Manual Flutter Load Test</h1>
<pre id="log" style="background:#eee;padding:10px;font-size:14px"></pre>
<script>
var log = document.getElementById('log');
function addLog(msg) { log.textContent += msg + '\n'; }
</script>
<script src="flutter.js"></script>
<script>
addLog('1. flutter.js loaded');
addLog('2. _flutter = ' + typeof _flutter);
addLog('3. _flutter.loader = ' + typeof _flutter.loader);

_flutter.buildConfig = {"engineRevision":"cb4b5fff73850b2e42bd4de7cb9a4310a78ac40d","useLocalCanvasKit":true,"builds":[{"compileTarget":"dart2js","renderer":"html","mainJsPath":"main.dart.js"}]};

addLog('4. buildConfig set');
addLog('5. Calling _flutter.loader.load()...');

// Hook into the loading process
var origLoad = _flutter.loader.load.bind(_flutter.loader);
_flutter.loader.load = function() {
  addLog('6. load() called');
  var result = origLoad();
  addLog('7. load() returned: ' + result);
  if (result && result.then) {
    result.then(function() { addLog('8. load() promise resolved'); })
          .catch(function(err) { addLog('8. load() ERROR: ' + err); });
  }
  return result;
};

_flutter.loader.load();

addLog('9. After load() call - this should appear');

setTimeout(function() {
  addLog('10. Timeout 5s - checking for main.dart.js script');
  var scripts = document.querySelectorAll('script[src*="main.dart"]');
  addLog('    main.dart.js scripts found: ' + scripts.length);
  for (var s of scripts) {
    addLog('    src=' + s.src + ', loaded=' + (s.src ? 'true' : 'inline'));
  }
  addLog('11. _flutter = ' + typeof _flutter);
  if (_flutter.loader.didCreateEngineInitializer) {
    addLog('12. has didCreateEngineInitializer: function');
  } else {
    addLog('12. didCreateEngineInitializer: not a function');
  }
}, 5000);

setTimeout(function() {
  addLog('13. Timeout 15s - final check');
  var children = document.body.children.length;
  addLog('    body children: ' + children);
  for (var i = 0; i < children; i++) {
    var el = document.body.children[i];
    addLog('    [' + i + '] ' + el.tagName + (el.id ? '#' + el.id : '') + (el.className ? '.' + el.className : ''));
  }
  addLog('    head children: ' + document.head.children.length);
  addLog('    canvas elements: ' + document.querySelectorAll('canvas').length);
  addLog('    flutter-view elements: ' + document.querySelectorAll('flt-view,flt-scene,flt-canvas').length);
}, 15000);
</script>
</body>
</html>
