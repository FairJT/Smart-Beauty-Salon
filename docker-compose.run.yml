services:

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: SmartSalonSQL
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - salon-network

  salonos-api:
    build:
      context: .
      dockerfile: Dockerfile.SalonOS
    container_name: SalonOSApi
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:5016"
    ports:
      - "5016:5016"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5016/swagger/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - salon-network

  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile.FlutterWeb
    container_name: FlutterWeb
    ports:
      - "8081:80"
    depends_on:
      salonos-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - salon-network

volumes:
  sqlserver_data:

networks:
  salon-network:
    driver: bridge
