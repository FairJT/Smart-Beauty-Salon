name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartSalon/SmartSalon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  backend-salonos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SalonOS.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  flutter-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_salon_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.x
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
