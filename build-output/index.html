<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart Salon App">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smart_salon_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>smart_salon_app</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.onerror = function(msg, url, line, col, err) {
      document.body.innerHTML = '<pre style="color:red;white-space:pre-wrap">ERROR: ' + msg + '\n' + (err ? err.stack : '') + '</pre>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<pre style="color:red;white-space:pre-wrap">PROMISE REJECTION: ' + e.reason + '\n' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>';
    });
  </script>
  <script src="flutter_bootstrap.js"></script>
</head>
<body>
</body>
</html>
