server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    

    # Proxy API calls disabled for standalone container
    # Proxy API calls disabled for standalone container

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of shell and service worker files
    location = /index.html               { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache"; }
}
